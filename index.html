<style>
  :root{
    --bg:#ede8d8;
    --bg2:#e6e0cc;
    --surface:#ffffff;
    --surface-2:#f7f2e3;
    --ink:#2a2620;
    --ink-soft:#7c7359;
    --line:#ddd5ba;
    --moss:#7d8a48;
    --moss-deep:#535d2f;
    --moss-soft:#e3e6cd;
    --gold:#b9862f;
    --gold-deep:#8c631f;
    --gold-soft:#f2e2bb;
    --sky:#4f7f9c;
    --sky-soft:#dbe7ec;
    --brick:#a35a2e;
    --brick-soft:#f2ded0;
    --shadow:rgba(58,48,20,0.10);
    --egg-c:#d8a83c;
    --larva-c:#7d8a48;
    --pupa-c:#7fa8c2;
  }
  body[data-theme="dark"]{
    --bg:#1b1810;
    --bg2:#14120c;
    --surface:#242017;
    --surface-2:#2b2619;
    --ink:#f1ecda;
    --ink-soft:#a89f81;
    --line:#3a3526;
    --moss:#a3b571;
    --moss-deep:#c8d69c;
    --moss-soft:#333a1f;
    --gold:#e0b563;
    --gold-deep:#f2cd8c;
    --gold-soft:#3d301a;
    --sky:#8fc0dd;
    --sky-soft:#20323c;
    --brick:#e2916a;
    --brick-soft:#3b2416;
    --shadow:rgba(0,0,0,0.5);
    --egg-c:#dab65c;
    --larva-c:#8fae5e;
    --pupa-c:#7fa8c2;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    padding:32px 20px 60px;
    background:linear-gradient(160deg, var(--bg2) 0%, var(--bg) 55%);
    color:var(--ink);
    font-family:'Noto Sans TC','Microsoft JhengHei',Arial,sans-serif;
    transition:background .25s ease,color .25s ease;
  }
  .wrap{max-width:1040px;margin:0 auto;}

  /* ---- topbar ---- */
  .topbar{
    display:flex;justify-content:space-between;align-items:center;
    padding-bottom:14px;margin-bottom:22px;
    border-bottom:1px solid var(--line);
  }
  .brandmark{
    display:flex;align-items:center;gap:10px;
    font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;
    color:var(--ink-soft);text-transform:uppercase;
  }
  .brandmark .logo-mark{width:28px;height:28px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px var(--gold-soft);}
  .brandmark .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px var(--gold-soft);}
  .pillbar{display:flex;gap:8px;}
  .pill{
    font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;
    border:1px solid var(--line);background:var(--surface);color:var(--ink);
    padding:7px 13px;border-radius:999px;cursor:pointer;
    transition:border-color .15s ease,transform .15s ease;
  }
  .pill:hover{border-color:var(--gold);transform:translateY(-1px);}

  /* ---- hero ---- */
  .hero{margin-bottom:26px;}
  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.1em;
    color:var(--gold-deep);background:var(--gold-soft);
    padding:5px 12px;border-radius:999px;margin-bottom:14px;font-weight:600;
  }
  h1{
    font-family:'Noto Serif TC',serif;font-weight:700;
    font-size:clamp(24px,3.4vw,34px);margin:0 0 10px;line-height:1.35;
    color:var(--ink);
  }
  .subtitle{color:var(--ink-soft);font-size:14.5px;line-height:1.7;max-width:640px;}

  /* ---- control strip ---- */
  .controls{
    display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;
    background:var(--surface);border:1px solid var(--line);
    border-radius:16px;padding:20px;margin-bottom:30px;
    box-shadow:0 10px 26px var(--shadow);
  }
  .field{flex:1;min-width:170px;}
  .field label{
    display:block;font-size:12px;font-weight:600;color:var(--ink-soft);
    margin-bottom:7px;font-family:'IBM Plex Mono',monospace;letter-spacing:.03em;
  }
  .field input{
    width:100%;padding:11px 12px;border-radius:10px;
    border:1px solid var(--line);background:var(--surface-2);color:var(--ink);
    font-size:15px;font-family:'IBM Plex Mono',monospace;outline:none;
    transition:border-color .15s ease,box-shadow .15s ease;
  }
  .field input:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft);}
  .run-btn{
    flex:0 0 auto;
    background:var(--gold);color:#fdfdf8;border:none;cursor:pointer;
    font-family:'Noto Sans TC',sans-serif;font-weight:700;font-size:15px;
    padding:12.5px 26px;border-radius:10px;
    box-shadow:0 8px 18px rgba(185,134,47,.28);
    transition:transform .15s ease,box-shadow .15s ease,background .15s ease;
  }
  .run-btn:hover{transform:translateY(-1px);background:var(--gold-deep);}
  .run-btn:active{transform:translateY(0);}

  /* ---- empty state ---- */
  .empty-state{
    border:1px dashed var(--line);border-radius:16px;padding:46px 24px;
    text-align:center;color:var(--ink-soft);font-size:14px;line-height:1.8;
    background:var(--surface-2);
  }
  .empty-state strong{display:block;color:var(--ink);font-size:16px;margin-bottom:6px;font-family:'Noto Serif TC',serif;}

  /* ---- scenario cards ---- */
  .scenario-grid{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));
    gap:18px;margin-bottom:22px;
  }
  .scenario-card{
    background:var(--surface);border:1px solid var(--line);border-radius:16px;
    padding:22px;box-shadow:0 10px 26px var(--shadow);
    animation:rise .45s ease both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .scenario-head{
    display:flex;justify-content:space-between;align-items:flex-start;
    margin-bottom:16px;gap:10px;
  }
  .scenario-name{font-family:'Noto Serif TC',serif;font-weight:700;font-size:16.5px;line-height:1.4;}
  .temp-badge{
    font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;
    color:var(--sky);background:var(--sky-soft);
    padding:5px 10px;border-radius:8px;white-space:nowrap;flex:0 0 auto;
  }

  /* life-cycle timeline (signature element) */
  .timeline-label{
    font-size:11px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;
    letter-spacing:.04em;margin-bottom:8px;
  }
  .timeline{display:flex;height:34px;border-radius:9px;overflow:hidden;margin-bottom:6px;box-shadow:inset 0 0 0 1px var(--line);}
  .timeline .seg{
    display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:600;color:#fff;
    position:relative;transition:flex-basis .5s ease;
  }
  .seg.egg{background:var(--egg-c);}
  .seg.larva{background:var(--larva-c);}
  .seg.pupa{background:var(--pupa-c);}
  .timeline-legend{
    display:flex;gap:16px;flex-wrap:wrap;margin-bottom:18px;font-size:12px;color:var(--ink-soft);
  }
  .timeline-legend span{display:inline-flex;align-items:center;gap:6px;}
  .swatch{width:9px;height:9px;border-radius:2px;}

  /* stat tiles */
  .stat-grid{
    display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;
  }
  .stat-tile{
    background:var(--surface-2);border:1px solid var(--line);border-radius:10px;
    padding:11px 10px;text-align:center;
  }
  .stat-tile .val{
    font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:18px;color:var(--ink);
    display:block;
  }
  .stat-tile .lbl{font-size:11px;color:var(--ink-soft);margin-top:3px;display:block;}

  /* peak / status */
  .peak-row{
    display:flex;justify-content:space-between;align-items:center;
    background:var(--surface-2);border:1px solid var(--line);border-radius:10px;
    padding:13px 15px;margin-bottom:14px;gap:10px;flex-wrap:wrap;
  }
  .peak-text{font-size:13.5px;color:var(--ink);}
  .peak-text b{font-family:'IBM Plex Mono',monospace;color:var(--ink);}
  .status-badge{
    font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:700;
    padding:6px 12px;border-radius:999px;white-space:nowrap;
  }
  .status-badge.safe{background:var(--moss-soft);color:var(--moss-deep);}
  .status-badge.warn{background:var(--brick-soft);color:var(--brick);}

  /* action card */
  .action-card{
    border-radius:12px;padding:15px 16px;
    background:var(--brick-soft);border:1px solid var(--brick);
  }
  .action-card.safe{background:var(--moss-soft);border-color:var(--moss);}
  .action-title{
    font-weight:700;font-size:13.5px;margin-bottom:9px;
    color:var(--brick);display:flex;align-items:center;gap:6px;
  }
  .action-card.safe .action-title{color:var(--moss-deep);}
  .action-list{margin:0;padding:0;list-style:none;font-size:13px;line-height:1.9;color:var(--ink);}
  .action-list b{font-family:'IBM Plex Mono',monospace;}

  /* chart panel */
  .panel{
    background:var(--surface);border:1px solid var(--line);border-radius:16px;
    padding:22px;margin-bottom:18px;box-shadow:0 10px 26px var(--shadow);
  }
  .panel h3{
    margin:0 0 14px;font-family:'Noto Serif TC',serif;font-size:16.5px;font-weight:700;
  }
  canvas{width:100%;height:320px;display:block;}

  /* text report toggle */
  details.report{
    background:var(--surface);border:1px solid var(--line);border-radius:16px;
    padding:6px 22px;box-shadow:0 10px 26px var(--shadow);
  }
  details.report summary{
    cursor:pointer;padding:14px 0;font-weight:600;font-size:13.5px;color:var(--ink-soft);
    list-style:none;display:flex;align-items:center;gap:8px;
  }
  details.report summary::-webkit-details-marker{display:none;}
  details.report summary::before{content:'▸';font-size:11px;color:var(--gold);transition:transform .2s ease;}
  details.report[open] summary::before{transform:rotate(90deg);}
  pre{
    white-space:pre-wrap;word-break:break-word;
    font-family:'IBM Plex Mono',monospace;font-size:12.5px;line-height:1.8;
    background:var(--surface-2);border:1px solid var(--line);border-radius:10px;
    padding:16px;margin:0 0 18px;color:var(--ink-soft);
  }
  @media (max-width:520px){
    .stat-grid{grid-template-columns:repeat(2,1fr);}
    .controls{flex-direction:column;align-items:stretch;}
  }
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
</style>
</head>

      chartTitle: '族群數量變化模擬 (60天)',

    },
    en: {

      tag: 'Smart Decision · Risk Alert',

      subtitle: 'Chiayi Minxiong second-crop rice · Enter month and initial egg density for life-cycle timing, population trend and spray guidance',

      eggsLabel: 'Initial egg density (eggs/m²)',
      runButton: 'Run simulation →',
      emptyTitle: 'No simulation yet',
      emptyHint: 'Set the month and initial egg density, then press "Run simulation" to see life-cycle timing and control advice',

      alertEggs: 'Please enter a non-negative initial egg density',
      scenarioNames: ['Recent 5-yr climate baseline (2021-2025)', 'Recent 10-yr climate baseline (2016-2025)'],
      timelineLabel: 'Single-generation life cycle (no intervention)',

      statEgg: 'Egg stage', statLarva: 'Larval stage', statPupa: 'Pupal stage', statGen: 'Full generation',
      dayUnit: 'days',
      peakText: (day, val) => `Larval peak estimated on day <b>${day}</b>, reaching <b>${val.toFixed(1)}</b> individuals/m²`,
      statusSafe: 'Safe', statusWarn: 'Exceeds threshold',
      actionWarnTitle: '⚠ Recommended action',
      actionSafeTitle: '✓ No spraying needed',
      sprayDay: (d) => `Recommended spray day: <b>${Math.round(d)}</b> (as eggs begin hatching)`,
      dose: (d) => `Minimum limonene dose: <b>${d.toFixed(0)}</b> mL/ha`,
      duration: (d) => `Expected protection: <b>${d}</b> days (volatilization decay model)`,

      reportToggle: 'View full text report',
      header: (month) => `Chiayi Minxiong District — Month ${month} outbreak & control advisory\n`,
      devTitle: 'Development timeline prediction (without intervention):',
      eggStage: (d) => ` - Egg stage: about ${d.toFixed(1)} days to hatch`,
      larvaStage: (d) => ` - Larval stage: about ${d.toFixed(1)} days (main damage period)`,
      pupaStage: (d) => ` - Pupal stage: about ${d.toFixed(1)} days to emerge`,
      fullGen: (d) => ` - Full generation: about ${d.toFixed(1)} days`,
      warnTitle: 'Risk warning and control recommendation:',
      warnMsg: (t) => ` - Warning: larval population exceeds economic threshold (${t} individuals/m²)!`,
      recTitle: ' - Recommended action:',
      spraySimple: (d) => `   > Spray on day ${Math.round(d)} (as eggs begin hatching in large numbers).`,
      doseSimple: (d) => `   > Minimum recommended limonene dose: ${d.toFixed(0)} mL/ha.`,
      durationSimple: (d) => `   > Expected protection lasts ${d} days (based on volatilization decay model).`,
      safeMsgSimple: (t) => ` - Safe: peak larval count stays below the damage threshold (${t} individuals/m²).`,
      safeAdviceSimple: '   > Recommendation: no limonene needed at this time; continue monitoring.',
      summary: 'Summary: where the two climate baselines suggest different timing, use the recent 5-year baseline as the primary decision basis.'
    }
  };

  let lang = localStorage.getItem('lang') || 'zh';
  let theme = localStorage.getItem('theme') || 'light';
  let lastRun = null; // {month, eggs}

  function applyTheme(){
    document.body.setAttribute('data-theme', theme);
    document.getElementById('themeToggle').textContent = theme === 'dark' ? '☀️' : '🌙';
    localStorage.setItem('theme', theme);
  }
  function toggleTheme(){ theme = theme === 'light' ? 'dark' : 'light'; applyTheme(); if(lastRun) renderAll(lastRun.month, lastRun.eggs); }

  function toggleLanguage(){
    lang = lang === 'zh' ? 'en' : 'zh';
    localStorage.setItem('lang', lang);
    applyStaticText();
    if(lastRun) renderAll(lastRun.month, lastRun.eggs);
  }

  function applyStaticText(){
    const t = T[lang];
    document.documentElement.lang = lang === 'zh' ? 'zh-Hant' : 'en';
    document.getElementById('brandText').textContent = t.brand;
    document.getElementById('tagText').textContent = t.tag;
    document.getElementById('titleText').textContent = t.title;
    document.getElementById('subtitleText').textContent = t.subtitle;
    document.getElementById('monthLabel').textContent = t.monthLabel;
    document.getElementById('eggsLabel').textContent = t.eggsLabel;
    document.getElementById('runButton').textContent = t.runButton;
    document.getElementById('langToggle').textContent = lang === 'zh' ? 'English' : '中文';
    const empty = document.getElementById('emptyState');
    if(empty){
      empty.querySelector('strong').textContent = t.emptyTitle;
      document.getElementById('emptyHint').textContent = t.emptyHint;
    }
  }

  function computeScenario(temp){
    const daysEgg = 60.2 / (temp - 12);
    const daysLarva = 240.0 / (temp - 11);
    const daysPupa = 84.0 / (temp - 14);

    const daysSim = 60;
    const s = [0.9, 0.8, 0.9, 0.85];
    const p = [1 / daysEgg, 1 / daysLarva, 1 / daysPupa];
    const f = (200 * 0.5) / 14;
    const m = [
      [s[0]*(1-p[0]), 0, 0, f],
      [s[0]*p[0], s[1]*(1-p[1]), 0, 0],
      [0, s[1]*p[1], s[2]*(1-p[2]), 0],
      [0, 0, s[2]*p[2], s[3]]
    ];
    const pop = Array.from({length:4}, () => Array(daysSim).fill(0));
    return {daysEgg, daysLarva, daysPupa, m, pop, daysSim};
  }

  function runSimulation(){
    const month = parseInt(document.getElementById('month').value, 10);
    const eggs = parseFloat(document.getElementById('initialEggs').value);
    const t = T[lang];
    if(isNaN(month) || month < 7 || month > 10){ alert(t.alertMonth); return; }
    if(isNaN(eggs) || eggs < 0){ alert(t.alertEggs); return; }
    lastRun = {month, eggs};
    renderAll(month, eggs);
  }

  function renderAll(month, initialEggs){
    const t = T[lang];
    const temps = [TEMP_5YR[month-7], TEMP_10YR[month-7]];
    const results = temps.map((temp) => {
      const sc = computeScenario(temp);
      sc.pop[0][0] = initialEggs;
      for(let step=0; step<sc.daysSim-1; step++){
        const next = [0,0,0,0];
        for(let row=0; row<4; row++){
          let total = 0;
          for(let col=0; col<4; col++) total += sc.m[row][col]*sc.pop[col][step];
          next[row] = total;
        }
        for(let row=0; row<4; row++) sc.pop[row][step+1] = next[row];
      }
      const larvaSeries = sc.pop[1];
      const maxLarva = Math.max(...larvaSeries);
      const peakDay = larvaSeries.indexOf(maxLarva) + 1;
      const warning = maxLarva > THRESHOLD;
      let recommendDose = null, sprayDay = null;
      if(warning){
        const reduceRatioNeeded = (maxLarva - THRESHOLD) / maxLarva;
        const doseMultiplier = reduceRatioNeeded / LETHAL_RATE;
        recommendDose = STANDARD_DOSE * doseMultiplier;
        sprayDay = sc.daysEgg;
      }
      return {temp, daysEgg: sc.daysEgg, daysLarva: sc.daysLarva, daysPupa: sc.daysPupa,
               larvaSeries, maxLarva, peakDay, warning, recommendDose, sprayDay};
    });

    renderScenarioCards(results, t);
    renderChart(results, t);
    renderTextReport(month, results, t);
  }

  function renderScenarioCards(results, t){
    const area = document.getElementById('resultsArea');
    area.innerHTML = '';

    const grid = document.createElement('div');
    grid.className = 'scenario-grid';

    results.forEach((r, i) => {
      const total = r.daysEgg + r.daysLarva + r.daysPupa;
      const wEgg = (r.daysEgg/total*100).toFixed(1);
      const wLarva = (r.daysLarva/total*100).toFixed(1);
      const wPupa = (r.daysPupa/total*100).toFixed(1);

      const card = document.createElement('div');
      card.className = 'scenario-card';
      card.style.animationDelay = (i*0.08)+'s';

      const statusCls = r.warning ? 'warn' : 'safe';
      const statusLabel = r.warning ? t.statusWarn : t.statusSafe;

      let actionHtml = '';
      if(r.warning){
        actionHtml = `<div class="action-card">
          <div class="action-title">${t.actionWarnTitle}</div>
          <ul class="action-list">
            <li>${t.sprayDay(r.sprayDay)}</li>
            <li>${t.dose(r.recommendDose)}</li>
            <li>${t.duration(DURATION_DAYS)}</li>
          </ul>
        </div>`;
      } else {
        actionHtml = `<div class="action-card safe">
          <div class="action-title">${t.actionSafeTitle}</div>
          <ul class="action-list"><li>${t.safeAdvice}</li></ul>
        </div>`;
      }

      card.innerHTML = `
        <div class="scenario-head">
          <div class="scenario-name">${t.scenarioNames[i]}</div>
          <div class="temp-badge">${r.temp.toFixed(1)}℃</div>
        </div>
        <div class="timeline-label">${t.timelineLabel}</div>
        <div class="timeline">
          <div class="seg egg" style="flex-basis:${wEgg}%">${r.daysEgg.toFixed(1)}${t.dayUnit}</div>
          <div class="seg larva" style="flex-basis:${wLarva}%">${r.daysLarva.toFixed(1)}${t.dayUnit}</div>
          <div class="seg pupa" style="flex-basis:${wPupa}%">${r.daysPupa.toFixed(1)}${t.dayUnit}</div>
        </div>
        <div class="timeline-legend">
          <span><span class="swatch" style="background:var(--egg-c)"></span>${t.eggSeg}</span>
          <span><span class="swatch" style="background:var(--larva-c)"></span>${t.larvaSeg}</span>
          <span><span class="swatch" style="background:var(--pupa-c)"></span>${t.pupaSeg}</span>
        </div>
        <div class="stat-grid">
          <div class="stat-tile"><span class="val">${r.daysEgg.toFixed(1)}</span><span class="lbl">${t.statEgg}</span></div>
          <div class="stat-tile"><span class="val">${r.daysLarva.toFixed(1)}</span><span class="lbl">${t.statLarva}</span></div>
          <div class="stat-tile"><span class="val">${r.daysPupa.toFixed(1)}</span><span class="lbl">${t.statPupa}</span></div>
          <div class="stat-tile"><span class="val">${total.toFixed(1)}</span><span class="lbl">${t.statGen}</span></div>
        </div>
        <div class="peak-row">
          <div class="peak-text">${t.peakText(r.peakDay, r.maxLarva)}</div>
          <div class="status-badge ${statusCls}">${statusLabel}</div>
        </div>
        ${actionHtml}
      `;
      grid.appendChild(card);
    });

    area.appendChild(grid);

    const chartPanel = document.createElement('div');
    chartPanel.className = 'panel';
    chartPanel.innerHTML = `<h3>${t.chartTitle}</h3><canvas id="chartCanvas" width="900" height="320"></canvas>`;
    area.appendChild(chartPanel);

    const reportDetails = document.createElement('details');
    reportDetails.className = 'report';
    reportDetails.innerHTML = `<summary>${t.reportToggle}</summary><pre id="resultOutput"></pre>`;
    area.appendChild(reportDetails);
  }

  function renderChart(results, t){
    const canvas = document.getElementById('chartCanvas');
    const ctx = canvas.getContext('2d');
    const width = canvas.width, height = canvas.height;
    const padding = {top:26, right:20, bottom:36, left:50};
    const chartW = width - padding.left - padding.right;
    const chartH = height - padding.top - padding.bottom;

    ctx.clearRect(0,0,width,height);
    const lineColor = getComputedStyle(document.body).getPropertyValue('--line').trim();
    const inkColor = getComputedStyle(document.body).getPropertyValue('--ink-soft').trim();

    ctx.strokeStyle = lineColor;
    ctx.lineWidth = 1;
    for(let i=0;i<=5;i++){
      const y = padding.top + (chartH/5)*i;
      ctx.beginPath(); ctx.moveTo(padding.left,y); ctx.lineTo(width-padding.right,y); ctx.stroke();
    }

    const maxValue = Math.max(...results.flatMap(r => r.larvaSeries));
    const scaleY = chartH / Math.max(maxValue, THRESHOLD*2, 1);
    const scaleX = chartW / 59;
    const bodyStyle = getComputedStyle(document.body);
    const colors = [bodyStyle.getPropertyValue('--moss').trim(), bodyStyle.getPropertyValue('--gold').trim()];

    results.forEach((r, idx) => {
      ctx.strokeStyle = colors[idx];
      ctx.lineWidth = 2;
      ctx.beginPath();
      r.larvaSeries.forEach((v,i) => {
        const x = padding.left + i*scaleX;
        const y = padding.top + chartH - v*scaleY;
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      });
      ctx.stroke();
    });

    ctx.strokeStyle = getComputedStyle(document.body).getPropertyValue('--brick').trim();
    ctx.setLineDash([5,5]);
    ctx.lineWidth = 1.5;
    const ty = padding.top + chartH - THRESHOLD*scaleY;
    ctx.beginPath(); ctx.moveTo(padding.left,ty); ctx.lineTo(width-padding.right,ty); ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = inkColor;
    ctx.font = '11px "IBM Plex Mono", monospace';
    ctx.fillText(t.chartThreshold, padding.left+4, ty-6);
    ctx.fillText('0', padding.left-16, height-14);
    ctx.fillText('60 ' + t.axisX, width-padding.right-40, height-14);
    ctx.fillText(t.axisY, padding.left, 14);

    results.forEach((r,idx) => {
      ctx.fillStyle = colors[idx];
      ctx.fillRect(padding.left + idx*130, height-8, 9, 9);
      ctx.fillStyle = inkColor;
      ctx.fillText(t.scenarioShort ? t.scenarioShort[idx] : (idx===0? (lang==='zh'?'近5年':'5-yr') : (lang==='zh'?'近10年':'10-yr')), padding.left + idx*130 + 13, height-1);
    });
  }

  function renderTextReport(month, results, t){
    let out = t.header(month) + '\n';
    results.forEach((r, i) => {
      out += `【${t.scenarioNames[i]}】(${lang==='zh'?'平均氣溫':'Avg temp'}: ${r.temp.toFixed(1)}℃)\n`;
      out += ` ${t.devTitle}\n`;
      out += t.eggStage(r.daysEgg) + '\n';
      out += t.larvaStage(r.daysLarva) + '\n';
      out += t.pupaStage(r.daysPupa) + '\n';
      out += t.fullGen(r.daysEgg + r.daysLarva + r.daysPupa) + '\n\n';
      out += ` ${t.warnTitle}\n`;
      out += ` - ${t.peakText(r.peakDay, r.maxLarva).replace(/<\/?b>/g,'')}\n`;
      if(r.warning){
        out += t.warnMsg(THRESHOLD) + '\n';
        out += t.recTitle + '\n';
        out += t.spraySimple(r.sprayDay) + '\n';
        out += t.doseSimple(r.recommendDose) + '\n';
        out += t.durationSimple(DURATION_DAYS) + '\n\n';
      } else {
        out += t.safeMsgSimple(THRESHOLD) + '\n';
        out += t.safeAdviceSimple + '\n\n';
      }
    });
    out += t.summary;
    const pre = document.getElementById('resultOutput');
    if(pre) pre.textContent = out;
  }

  applyTheme();
  applyStaticText();
</script>
